<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Innova News - Sede Canta Callao</title>
    <meta name="description" content="Plataforma oficial del Comité Periodístico Innova News de Innova Schools - Sede Canta Callao. Ediciones mensuales, redacción, audiovisual y portal de equipo." />
    <link rel="icon" type="image/png" href="https://i.postimg.cc/G3yyhNz3/innova-news-logo-3-removebg-preview.png" />
    
    <!-- OpenGraph & Twitter Cards -->
    <meta property="og:title" content="Innova News - Sede Canta Callao" />
    <meta property="og:description" content="Plataforma oficial del Comité Periodístico Innova News de Innova Schools - Sede Canta Callao. Ediciones mensuales, redacción, audiovisual y portal de equipo." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Plus Jakarta Sans & Newsreader -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Estilos Principales -->
    <link rel="stylesheet" href="./src/index.css" />

    <!-- Script de inicialización inmediata de tema (Modo Oscuro / Claro sin parpadeos) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("innova_news_theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved || (prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- SCRIPT PRINCIPAL JAVASCRIPT (COMPILACIÓN VITE / GITHUB PAGES) -->
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
